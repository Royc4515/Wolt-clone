# Ex3 — runs the two servers the assignment requires, each in its own container:
#   * ex2-server : the legacy Ex2 C++ recommendation server (TCP, :8080)
#   * web        : the Node.js + Express web server (HTTP API, :3000)
# The web server reaches the C++ server by the service hostname `ex2-server`
# over the shared `wolt` network (see src/config/env.js → EX2_HOST).
#
# Run:  docker compose up --build      (web on http://localhost:3000)

services:
  # Legacy Ex2 C++ recommendation server.
  ex2-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: ["./WoltClone", "8080"]
    ports:
      # Bound to localhost only: reachable for local debugging, not exposed to the
      # network. The web service talks to it over the internal `wolt` network and
      # does not need this published at all.
      - "127.0.0.1:8080:8080"
    # Report "healthy" only once the TCP port actually accepts connections, so the
    # web service can wait for readiness (not just container creation) below.
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - wolt

  # Ex3 Node.js + Express web server (the app).
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - EX2_HOST=ex2-server   # resolves to the C++ container on the wolt network
      - EX2_PORT=8080
    depends_on:
      ex2-server:
        condition: service_healthy   # wait until the C++ server actually accepts TCP
    networks:
      - wolt

networks:
  wolt:
    driver: bridge
