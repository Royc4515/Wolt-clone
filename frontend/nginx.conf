# nginx config for the React single-page app (Ex4).
# - Serves the compiled static bundle from /usr/share/nginx/html.
# - Falls back to index.html so client-side routing (React Router) survives a
#   hard refresh / deep link.
# - Reverse-proxies API and image requests to the Node web server, which is
#   reachable as host `web` on the shared `wolt` docker network.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets for faster page loads.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API requests -> Node/Express web server.
    location /api/ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Images uploaded/served by the Node server.
    location /images/ {
        proxy_pass http://web:3000;
    }

    # Everything else is the single-page app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
